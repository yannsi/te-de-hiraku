<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手でひらく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --fg:#1d1d1f; --sub:#6b6b70; --card:#ffffff; --line:#e3e0d8;
    --accent:#0f766e; --accent-soft:#d5efeb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121314; --fg:#f2f2f2; --sub:#a0a0a6; --card:#1d1f21; --line:#2e3134;
      --accent:#2dd4bf; --accent-soft:#12403b;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"BIZ UDPGothic",sans-serif;line-height:1.5}
  main{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:1.5rem;margin:8px 0 4px}
  .lead{color:var(--sub);margin:0 0 16px;font-size:.95rem}

  .stage{position:relative;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;text-align:center;color:#fff;background:rgba(0,0,0,.6)}
  .overlay p{margin:0}
  button{font:inherit;font-weight:700;font-size:1.15rem;padding:14px 32px;border:0;border-radius:999px;
    background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}

  .status{margin:16px 0 8px;font-size:1.25rem;font-weight:700;min-height:1.9em}
  .bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent)}

  ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
    border-radius:12px;padding:10px 12px;transition:background .15s,border-color .15s}
  li.active{border-color:var(--accent);background:var(--accent-soft)}
  .emoji{font-size:2rem;width:2.4rem;text-align:center}
  .gname{font-weight:700}
  .site{color:var(--sub);font-size:.9rem}
  .note{color:var(--sub);font-size:.85rem;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>手でひらく</h1>
  <p class="lead">手の形を1秒続けると、そのサイトが開きます。</p>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <p id="msg">カメラで手の形を読み取ります</p>
      <button id="startBtn">はじめる</button>
    </div>
  </div>

  <div class="status" id="status">　</div>
  <div class="bar"><i id="gauge"></i></div>

  <ul id="list"></ul>

  <p class="note">サイトから戻るボタンで戻ったら、もう一度「はじめる」を押してください。<br>
  映像は端末の中だけで処理し、どこにも送りません。</p>
</main>

<script type="module">
import { GestureRecognizer, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===== ここを書き換えると、手の形と開くサイトを変えられます =====
// 使える形: Victory(ピース) / Thumb_Up(親指を上) / Thumb_Down(親指を下) /
//           ILoveYou(アイラブユー) / Pointing_Up(人さし指) / Open_Palm(パー) / Closed_Fist(グー)
const SITES = {
  Victory:  { emoji: "✌️", label: "ピース",       name: "YouTube",          url: "https://www.youtube.com/" },
  Thumb_Up: { emoji: "👍", label: "親指を上",     name: "天気（tenki.jp）", url: "https://tenki.jp/" },
  ILoveYou: { emoji: "🤟", label: "アイラブユー", name: "Googleマップ",     url: "https://www.google.com/maps" },
};
const HOLD_MS = 1000;   // 何ミリ秒続けたら開くか
const MIN_SCORE = 0.6;  // 認識の確からしさの下限（0〜1）
// ==========================================================

const JP = {
  None: "（形なし）", Closed_Fist: "グー", Open_Palm: "パー", Pointing_Up: "人さし指",
  Thumb_Down: "親指を下", Thumb_Up: "親指を上", Victory: "ピース", ILoveYou: "アイラブユー",
};

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const overlay = $("overlay"), msg = $("msg"), startBtn = $("startBtn");
const statusEl = $("status"), gauge = $("gauge"), list = $("list");
const drawer = new DrawingUtils(ctx);

// 一覧を表示
for (const [key, s] of Object.entries(SITES)) {
  const li = document.createElement("li");
  li.dataset.key = key;
  li.innerHTML = `<span class="emoji">${s.emoji}</span>
    <span><span class="gname">${s.label}</span><br><span class="site">→ ${s.name}</span></span>`;
  list.appendChild(li);
}

let recognizer = null, stream = null, running = false, lastVideoTime = -1;
let current = null, since = 0, lastSeen = 0, firing = false;

// ===== 読み込み（ページを開いた時点で始める） =====
let loadState = "読み込み中…";
let waitingForModel = false;

function showLoad(text) {
  loadState = text;
  if (waitingForModel || !overlay.hidden) msg.textContent = text;
}

// モデルを進み具合つきで取得する
async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("モデルを取得できません（" + res.status + "）");
  const total = Number(res.headers.get("content-length")) || 0;
  if (!res.body || !total) return new Uint8Array(await res.arrayBuffer());
  const reader = res.body.getReader();
  const buf = new Uint8Array(total);
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    if (got + value.length > buf.length) { // 念のため
      const bigger = new Uint8Array(got + value.length);
      bigger.set(buf.subarray(0, got));
      bigger.set(value, got);
      got += value.length;
      return bigger;
    }
    buf.set(value, got);
    got += value.length;
    showLoad(`読み込み中… ${Math.floor((got / total) * 100)}%`);
  }
  return buf.subarray(0, got);
}

async function loadModel() {
  showLoad("読み込み中…");
  const [fileset, model] = await Promise.all([
    FilesetResolver.forVisionTasks(WASM),
    fetchWithProgress(MODEL),
  ]);
  showLoad("仕上げ中…");
  const opts = (delegate) => ({
    baseOptions: { modelAssetBuffer: model, delegate },
    runningMode: "VIDEO",
    numHands: 1,
  });
  try {
    recognizer = await GestureRecognizer.createFromOptions(fileset, opts("GPU"));
  } catch {
    recognizer = await GestureRecognizer.createFromOptions(fileset, opts("CPU"));
  }
  showLoad("準備できました");
}

let modelPromise = loadModel().catch((e) => { modelPromise = null; throw e; });
modelPromise.catch(() => showLoad("読み込みに失敗しました。もう一度押してください"));

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    // カメラの起動と読み込みを同時に進める
    const cam = navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    if (!recognizer) {
      if (!modelPromise) modelPromise = loadModel();
      waitingForModel = true;
      msg.textContent = loadState;
    }
    stream = await cam;
    video.srcObject = stream;
    await video.play();
    if (!recognizer) await modelPromise;
    waitingForModel = false;
    overlay.hidden = true;
    current = null; firing = false; lastVideoTime = -1;
    running = true;
    requestAnimationFrame(loop);
  } catch (e) {
    waitingForModel = false;
    if (!recognizer) modelPromise = null;
    msg.textContent = "うまく始められませんでした：" + (e && e.message ? e.message : e);
    startBtn.disabled = false;
  }
});

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = recognizer.recognizeForVideo(video, performance.now());
    draw(res);
    handle(res);
  }
  requestAnimationFrame(loop);
}

function draw(res) {
  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const lm of res.landmarks || []) {
    drawer.drawConnectors(lm, GestureRecognizer.HAND_CONNECTIONS, { color: "#2dd4bf", lineWidth: 4 });
    drawer.drawLandmarks(lm, { color: "#ffffff", lineWidth: 1, radius: 3 });
  }
}

function handle(res) {
  const now = performance.now();
  const top = res.gestures && res.gestures[0] && res.gestures[0][0];
  const g = top && top.score >= MIN_SCORE && SITES[top.categoryName] ? top.categoryName : null;

  if (g) {
    lastSeen = now;
    if (g !== current) { current = g; since = now; }
  } else if (current && now - lastSeen > 300) {
    // 一瞬見失っただけなら続ける。0.3秒以上外れたらリセット
    current = null;
  }

  // 表示を更新
  for (const li of list.children) li.classList.toggle("active", li.dataset.key === current);
  if (current) {
    const p = Math.min(1, (now - since) / HOLD_MS);
    gauge.style.width = (p * 100) + "%";
    statusEl.textContent = `${SITES[current].emoji} ${SITES[current].label} → ${SITES[current].name}`;
    if (p >= 1 && !firing) go(current);
  } else {
    gauge.style.width = "0%";
    if (!res.landmarks || res.landmarks.length === 0) {
      statusEl.textContent = "手をカメラに見せてください";
    } else {
      const name = top ? (JP[top.categoryName] || top.categoryName) : "？";
      statusEl.textContent = `読み取り中：${name}`;
    }
  }
}

function stopCamera() {
  running = false;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
}

function go(key) {
  firing = true;
  statusEl.textContent = `${SITES[key].name} を開きます…`;
  stopCamera();
  setTimeout(() => { location.href = SITES[key].url; }, 300);
}

// 戻るボタンで戻ってきたとき
window.addEventListener("pageshow", (e) => {
  if (e.persisted) {
    stopCamera();
    firing = false; current = null;
    gauge.style.width = "0%";
    statusEl.textContent = "　";
    for (const li of list.children) li.classList.remove("active");
    msg.textContent = "おかえりなさい";
    startBtn.textContent = "もう一度はじめる";
    startBtn.disabled = false;
    overlay.hidden = false;
  }
});
</script>
</body>
</html>
